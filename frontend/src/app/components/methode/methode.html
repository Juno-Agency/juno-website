<section class="section" id="methode">
  <div class="shead">
    <span class="eyebrow r" appReveal>{{ tr('La méthode') }}</span>
    <h2 class="h2 r d1" appReveal [innerHTML]="tr(h2Text)"></h2>
  </div>
  <div class="steps" appReveal>
    @for (s of steps; track s.n) {
      <div class="step">
        <span class="node">{{ s.n }}</span>
        <h3>{{ tr(s.title) }}</h3>
        <p>{{ tr(s.text) }}</p>
        @if (s.fast) {
          <span class="fast">{{ tr(s.fast) }}</span>
        }
      </div>
    }
  </div>
</section>
