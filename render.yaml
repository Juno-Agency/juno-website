databases:
  - name: juno-db
    databaseName: juno
    user: juno
    plan: basic-256mb

services:
  - type: web
    name: juno-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: juno-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # ponytail: les fronts passent par un rewrite same-origin, CORS ne sert
        # qu'au `ng serve` local. Vider si l'API ne doit répondre qu'aux rewrites.
        value: http://localhost:4200
      - key: RUN_SEED
        value: 'true'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: juno-site
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      # Le back-office vit sur son propre host (cf. nginx.conf).
      - { type: redirect, source: /admin/*, destination: / }
      - { type: rewrite, source: /api/*, destination: https://juno-api.onrender.com/api/* }
      - { type: rewrite, source: /*, destination: /index.html }

  - type: web
    name: juno-admin
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - { type: redirect, source: /, destination: /admin }
      - { type: rewrite, source: /api/*, destination: https://juno-api.onrender.com/api/* }
      - { type: rewrite, source: /*, destination: /index.html }
