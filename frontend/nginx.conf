server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep redirects relative so they respect the published host port.
  absolute_redirect off;

  # Gzip
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API → backend service (same compose network)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-cache hashed assets
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Back-office lives in its own container — keep it off the public site.
  location = /admin { return 302 /; }
  location ^~ /admin/ { return 302 /; }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
