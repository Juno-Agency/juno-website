# La base vit désormais sur MongoDB Atlas (free tier, ne s'auto-supprime pas).
# La connection string est fournie via la variable DATABASE_URL du service juno-api
# (à renseigner dans le dashboard Render → Environment).

services:
  - type: web
    name: juno-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # ponytail: free s'endort après 15 min sans trafic entrant (~1 min au réveil).
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # MongoDB Atlas — à définir dans le dashboard Render (Environment).
        # Format : mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/juno?retryWrites=true&w=majority
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # ponytail: les fronts passent par un rewrite same-origin, CORS ne sert
        # qu'au `ng serve` local. Vider si l'API ne doit répondre qu'aux rewrites.
        value: http://localhost:4200
      # Back-office admin credentials — set both in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: juno-site
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      # Le back-office vit sur son propre host (cf. nginx.conf).
      - { type: redirect, source: /admin/*, destination: / }
      - { type: rewrite, source: /api/*, destination: https://juno-api-hhb0.onrender.com/api/* }
      - { type: rewrite, source: /*, destination: /index.html }

  - type: web
    name: juno-admin
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - { type: rewrite, source: /api/*, destination: https://juno-api-hhb0.onrender.com/api/* }
      - { type: rewrite, source: /*, destination: /index.html }
