<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>JUNO — Votre site, dessiné en quelques minutes</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="JUNO — agence web. Décrivez votre projet, on vous dessine une maquette, vous validez, on développe et on met en ligne. Clé en main." />
  <!-- Partage (LinkedIn, WhatsApp, Slack…) : ces balises sont communes à toutes
       les pages. og:title, og:description, og:url et le canonical sont posés page
       par page par SeoService, à partir de route.title et route.data.description.
       Les robots de partage exigent une URL absolue pour l'image. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="JUNO" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:image" content="https://agency-juno.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="JUNO — Votre site, dessiné en quelques minutes" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://agency-juno.com/og-image.png" />
  <!-- Le SVG sert les navigateurs modernes (net à toute taille) ; le .ico reste
       le repli pour les plus anciens et pour les agrégateurs de flux. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#141414" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
</head>
<body>
  <app-root></app-root>
</body>
</html>
