# La base vit désormais sur MongoDB Atlas (free tier, ne s'auto-supprime pas).
# La connection string est fournie via la variable DATABASE_URL du service juno-api
# (à renseigner dans le dashboard Render → Environment).

services:
  - type: web
    name: juno-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # ponytail: free s'endort après 15 min sans trafic entrant (~1 min au réveil).
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # MongoDB Atlas — à définir dans le dashboard Render (Environment).
        # Format : mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/juno?retryWrites=true&w=majority
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # ponytail: les fronts passent par un rewrite same-origin, CORS ne sert
        # qu'au `ng serve` local. Vider si l'API ne doit répondre qu'aux rewrites.
        value: http://localhost:4200
      # Clé du backlog partagé : seconde voie d'authentification sur
      # /api/tickets (en-tête x-api-key), à côté du JWT admin. Permet de gérer
      # les tickets depuis un poste de dev ou un script. Valeur dans le
      # dashboard, identique à celle des .env locaux. Vide = voie fermée.
      - key: TICKETS_API_KEY
        sync: false
      # Back-office admin credentials — set both in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # --- E-mails (Resend) — set in the Render dashboard ---
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        # Ex. "JUNO <contact@juno.studio>" — le domaine doit être vérifié dans Resend.
        sync: false
      - key: MAIL_REPLY_TO
        # Optionnel : adresse de réponse pour le récap client (ex. agencyjuno@gmail.com).
        sync: false
      - key: MAIL_INTERNAL_RECIPIENTS
        # Destinataires de la notif interne, séparés par des virgules (toi, Juno, Noah).
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        # Secret de signature du webhook Resend (Dashboard Resend → Webhooks).
        sync: false
      # --- Portfolio image storage (Cloudflare R2) — set in the dashboard ---
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

  - type: web
    name: juno-site
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      # Le back-office vit sur son propre host (cf. nginx.conf).
      - { type: redirect, source: /admin/*, destination: / }
      - { type: rewrite, source: /api/*, destination: https://juno-api-hhb0.onrender.com/api/* }
      # Chaque page publique est prérendue dans son propre dossier
      # (frontend/src/app/app.routes.server.ts). Render « n'applique pas de
      # règle si une ressource existe à ce chemin » — mais /realisations n'est
      # pas une ressource, le fichier est /realisations/index.html. Sans ces
      # règles, un catch-all servait la landing sur les cinq URLs : même
      # <title>, même description, contenu dupliqué pour Google.
      # Toute nouvelle route prérendue doit être ajoutée ici.
      - { type: rewrite, source: /projet, destination: /projet/index.html }
      - { type: rewrite, source: /projet/, destination: /projet/index.html }
      - { type: rewrite, source: /realisations, destination: /realisations/index.html }
      - { type: rewrite, source: /realisations/, destination: /realisations/index.html }
      - { type: rewrite, source: /mentions-legales, destination: /mentions-legales/index.html }
      - { type: rewrite, source: /mentions-legales/, destination: /mentions-legales/index.html }
      - { type: rewrite, source: /confidentialite, destination: /confidentialite/index.html }
      - { type: rewrite, source: /confidentialite/, destination: /confidentialite/index.html }
      # Pas de catch-all : il renverrait la landing en 200 sur n'importe quelle
      # URL inventée (soft 404). Ce qui ne correspond à aucun fichier doit
      # répondre 404 — un rewrite ne sait pas changer le statut.
    # Render ne pose de lui-même que HSTS et X-Content-Type-Options. Le reste
    # est déclaré ici (l'API, elle, est casquée par helmet côté Express).
    # Contrairement aux `routes`, ces règles ne font qu'ajouter : la fusion du
    # blueprint suffit, aucune action dans le dashboard.
    headers:
      - path: /*
        name: Content-Security-Policy
        # 'unsafe-inline' sur script-src : les pages prérendues embarquent deux
        # scripts inline générés par `withEventReplay()`, dont le contenu change
        # à chaque version d'Angular — les figer par hash casserait en silence.
        # L'option `security.autoCsp` du builder, qui les hacherait au build,
        # refuse de tourner avec le SSR/SSG (« Cannot set both SSR and auto-CSP »).
        # Le reste est verrouillé : aucun script externe, ni eval, ni objet.
        value: >-
          default-src 'self';
          base-uri 'self';
          object-src 'none';
          frame-ancestors 'none';
          form-action 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://cdn.agency-juno.com;
          connect-src 'self';
          manifest-src 'self';
          upgrade-insecure-requests
      # Doublon volontaire de frame-ancestors, pour les navigateurs qui ignorent
      # encore la directive CSP.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: >-
          accelerometer=(), camera=(), geolocation=(), gyroscope=(),
          magnetometer=(), microphone=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Render ne pose HSTS que sur ses propres domaines *.onrender.com : le
      # domaine réel (agency-juno.com) en sortait dépourvu. `includeSubDomains`
      # est sûr, cdn. et admin. répondent tous deux en HTTPS. Pas de `preload` :
      # l'inscription sur hstspreload.org est un engagement difficile à défaire.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    name: juno-admin
    runtime: static
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - { type: rewrite, source: /api/*, destination: https://juno-api-hhb0.onrender.com/api/* }
      - { type: rewrite, source: /*, destination: /index.html }
    headers:
      - path: /*
        name: Content-Security-Policy
        # 'unsafe-inline' sur script-src : les pages prérendues embarquent deux
        # scripts inline générés par `withEventReplay()`, dont le contenu change
        # à chaque version d'Angular — les figer par hash casserait en silence.
        # L'option `security.autoCsp` du builder, qui les hacherait au build,
        # refuse de tourner avec le SSR/SSG (« Cannot set both SSR and auto-CSP »).
        # Le reste est verrouillé : aucun script externe, ni eval, ni objet.
        value: >-
          default-src 'self';
          base-uri 'self';
          object-src 'none';
          frame-ancestors 'none';
          form-action 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: https://cdn.agency-juno.com;
          connect-src 'self';
          manifest-src 'self';
          upgrade-insecure-requests
      # Doublon volontaire de frame-ancestors, pour les navigateurs qui ignorent
      # encore la directive CSP.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: >-
          accelerometer=(), camera=(), geolocation=(), gyroscope=(),
          magnetometer=(), microphone=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Back-office : aucune URL ne doit fuiter vers un tiers, même l'origine.
      # Render ne pose HSTS que sur ses propres domaines *.onrender.com : le
      # domaine réel (agency-juno.com) en sortait dépourvu. `includeSubDomains`
      # est sûr, cdn. et admin. répondent tous deux en HTTPS. Pas de `preload` :
      # l'inscription sur hstspreload.org est un engagement difficile à défaire.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Referrer-Policy
        value: no-referrer
