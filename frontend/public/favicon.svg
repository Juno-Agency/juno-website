<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JUNO">
  <!--
    Favicon JUNO — la mascotte du site, figée dans sa pose de repos.
    Géométrie reprise telle quelle de frontend/src/app/shared/juno-mascot/ :
    silhouette blobPath(0, 0) de blob.ts, yeux, reflets et sourire du template
