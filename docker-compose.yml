services:
  db:
    # Image officielle : les images publiques Bitnami ont été retirées, et
    # `bitnami/mongodb:7.0` ne se résout plus du tout. Le replica set qui allait
    # avec n'a plus lieu d'être non plus — il ne servait qu'aux transactions
    # exigées par Prisma, remplacé depuis par Mongoose.
    image: mongo:7
    container_name: juno-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-juno}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-juno}
    volumes:
      - juno-mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet -u ${MONGO_USER:-root} -p ${MONGO_PASSWORD:-juno} --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 })" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    ports:
      - '${MONGO_PORT:-27017}:27017'

  backend:
    build: ./backend
    container_name: juno-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-juno}@db:27017/${MONGO_DB:-juno}?authSource=admin&directConnection=true
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      RUN_SEED: ${RUN_SEED:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@juno.studio}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  frontend:
    build: ./frontend
    container_name: juno-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-8080}:8080'

  backoffice:
    build:
      context: ./frontend
      dockerfile: Dockerfile.backoffice
    container_name: juno-backoffice
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${BACKOFFICE_PORT:-8090}:8080'

volumes:
  juno-mongo-data:
