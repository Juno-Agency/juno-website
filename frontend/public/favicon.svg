    <circle cx="25.4" cy="30.6" r="1.15" fill="#fcfcfb"/>
    <circle cx="39.5" cy="30" r="3.1" fill="#141414"/>
    <circle cx="40.4" cy="30.6" r="1.15" fill="#fcfcfb"/>
