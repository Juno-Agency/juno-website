# Cache-Control calculé ici plutôt que dans un `location` dédié : dès qu'un bloc
# `location` déclare son propre `add_header`, nginx cesse d'hériter de ceux du
# serveur — les en-têtes de sécurité disparaîtraient de toutes les réponses
# d'assets. Une `map` garde une seule liste d'en-têtes pour tout le site.
map $uri $juno_cache_control {
  default                                            "public, max-age=0, must-revalidate";
  "~*\.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$"  "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep redirects relative so they respect the published host port.
  absolute_redirect off;

  # En-têtes de sécurité. `always` est indispensable : sans lui, nginx les omet
  # sur les réponses d'erreur — la page 404 sortirait sans CSP.
  # 'unsafe-inline' sur script-src : les pages prérendues embarquent deux scripts
  # inline générés par `withEventReplay()`, dont le contenu change à chaque
  # version d'Angular. Les figer par hash casserait en silence.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.agency-juno.com; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $juno_cache_control always;

  # Gzip
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API → backend service (same compose network)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Les assets hachés existent ou n'existent pas — pas de repli SPA pour eux.
  # (Leur durée de cache vient de la `map` en tête de fichier.)
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    try_files $uri =404;
  }

  # Back-office lives in its own container — keep it off the public site.
  location = /admin { return 302 /; }
  location ^~ /admin/ { return 302 /; }

  # Les pages publiques sont prérendues dans leur propre dossier : `$uri/` sert
  # <route>/index.html. Ce qui ne correspond à aucun fichier répond un vrai 404
  # — l'ancien repli vers /index.html renvoyait la landing en 200 sur n'importe
  # quelle URL inventée, un soft 404 que Google compte comme contenu dupliqué.
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
